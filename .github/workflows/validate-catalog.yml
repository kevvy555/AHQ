name: Validate furniture catalogue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JSON and referenced assets
        run: node scripts/validate-catalog.mjs
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < assets/app.js
